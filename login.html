<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanayya Login</title><link rel="stylesheet" href="styles.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class="card" style="width:min(430px,100%)"><div class="logo">sanayya<b>.om</b></div><h1>Sign in</h1><p class="muted">One login system. Your dashboard changes according to the role assigned by Sanayya Admin.</p><label class="label">Email</label><input id="email" class="input" type="email" placeholder="your@email.com"><label class="label">Password</label><input id="password" class="input" type="password" placeholder="Your password"><label class="legal-check"><input id="termsCheck" type="checkbox"><span>I agree to the <a href="terms.html" target="_blank">Terms &amp; Conditions</a> and <a href="privacy.html" target="_blank">Privacy Policy</a>.</span></label><button id="loginBtn" class="btn">LOGIN</button><p id="msg" class="small-note"></p><a href="index.html" style="display:block;margin-top:15px;color:#2f80ed">← Back to website</a></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
document.getElementById('loginBtn').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const msg=document.getElementById('msg');if(!email||!password){msg.textContent='Enter your email and password.';return}if(!document.getElementById('termsCheck').checked){msg.textContent='Please agree to the Terms & Conditions and Privacy Policy before signing in.';return}const b=document.getElementById('loginBtn');b.disabled=true;b.textContent='SIGNING IN...';const {error}=await sb.auth.signInWithPassword({email,password});if(error){msg.textContent=error.message;b.disabled=false;b.textContent='LOGIN';return}const p=await getProfile();if(!p){msg.textContent='Login succeeded but your profile was not found.';await sb.auth.signOut();b.disabled=false;b.textContent='LOGIN';return}try{await recordLegalAcceptance(p.id);}catch(e){console.error(e);msg.textContent='We could not save your acceptance. Please try again.';await sb.auth.signOut();b.disabled=false;b.textContent='LOGIN';return}location.href=dashboardFor(p.role)};</script></body></html>
